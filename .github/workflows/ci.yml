name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      # In dependency order: blades, chart, tools, site. The chart's build runs
      # tsc and the tools' build runs tsgo, so this also typechecks them.
      - run: pnpm -r build

      - run: pnpm test
        env:
          CI: true
      - run: pnpm --filter react-bumps-chart check-exports
      # The site's types for the libraries come from their dist/, so these run
      # after the build.
      - run: pnpm --filter cambridgebumps.com lint
      - run: pnpm --filter cambridgebumps.com typecheck

      - name: Check AD format files match the TG sources
        working-directory: packages/bumps-results-tools
        run: |
          pnpm run generate:ad
          git add --intent-to-add results/ad_format
          git diff --exit-code --stat results/ad_format
