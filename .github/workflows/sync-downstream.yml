# Opens (or updates) a PR whenever main changes what the results' consumers
# use:
#   - apps/cambridgebumps.com, in this repo: generated results + stats JSON,
#     and its chart metadata
#   - johnwalley/bumps-results: the TG and AD format source files
#
# Needs a DOWNSTREAM_REPOS_TOKEN secret: a fine-grained PAT with Contents and
# Pull requests read/write on johnwalley/rowing and johnwalley/bumps-results.
# The site's PR is in this repo but still uses the PAT, because PRs opened
# with the default GITHUB_TOKEN don't trigger CI.

name: Sync downstream

on:
  push:
    branches: [main]
    paths:
      - "packages/bumps-results-tools/**"
      - ".github/workflows/sync-downstream.yml"
  workflow_dispatch:

concurrency:
  group: sync-downstream
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate
        working-directory: packages/bumps-results-tools

      - name: Copy results and stats into the site
        run: |
          for dir in results stats; do
            rsync -a --delete --prune-empty-dirs \
              --include='*/' --include='*.json' --exclude='*' \
              "packages/bumps-results-tools/output/$dir/" "apps/cambridgebumps.com/src/data/$dir/"
          done
          (cd apps/cambridgebumps.com && node scripts/generate-chart-meta.mjs)
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.DOWNSTREAM_REPOS_TOKEN }}
          add-paths: apps/cambridgebumps.com/src/data
          branch: sync/bumps-results-tools
          delete-branch: true
          commit-message: "Update the site's results data from bumps-results-tools at ${{ github.sha }}"
          title: Update the site's results data from bumps-results-tools
          body: |
            Regenerated `src/data/results`, `src/data/stats` and `src/data/chart-meta.json` in `apps/cambridgebumps.com` from `packages/bumps-results-tools` at ${{ github.sha }}.

            Opened automatically by the [Sync downstream](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) workflow.

  bumps-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rowing
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: rowing/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: rowing/.nvmrc
          cache: pnpm
          cache-dependency-path: rowing/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: rowing
      - run: pnpm run generate:ad
        working-directory: rowing/packages/bumps-results-tools

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: johnwalley/bumps-results
          token: ${{ secrets.DOWNSTREAM_REPOS_TOKEN }}
          path: bumps-results
      - name: Copy TG and AD format files into bumps-results
        run: |
          for dir in tg_format ad_format; do
            rsync -a --delete "rowing/packages/bumps-results-tools/results/$dir/" "bumps-results/results/$dir/"
          done
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: bumps-results
          token: ${{ secrets.DOWNSTREAM_REPOS_TOKEN }}
          branch: sync/bumps-results-tools
          delete-branch: true
          commit-message: "Update results from ${{ github.repository }}@${{ github.sha }}"
          title: Update results from bumps-results-tools
          body: |
            Copied `results/tg_format` and `results/ad_format` from `packages/bumps-results-tools` in ${{ github.repository }}@${{ github.sha }}.

            Opened automatically by the [Sync downstream](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) workflow.
