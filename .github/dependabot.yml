version: 2
updates:
  # The whole pnpm workspace: the root lockfile and every package.json.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # pnpm 11 won't install a release younger than its minimum release age.
    cooldown:
      default-days: 3
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
